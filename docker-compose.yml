services:
  postgres:
    image: postgres:16-alpine
    container_name: ase-postgres
    environment:
      POSTGRES_USER: ase
      POSTGRES_PASSWORD: ase_dev_pw
      POSTGRES_DB: ase
    ports:
      - '5432:5432'
    volumes:
      - ase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ase -d ase']
      interval: 2s
      timeout: 3s
      retries: 15

  scraper:
    build: ./scraper
    container_name: ase-scraper
    environment:
      SCRAPLING_HOST: 0.0.0.0
      SCRAPLING_PORT: '8410'
    ports:
      - '8410:8410'
    # The stealth browser needs a writable home for its profile.
    volumes:
      - ase_scraper_cache:/root/.cache

volumes:
  ase_pgdata:
  ase_scraper_cache:
